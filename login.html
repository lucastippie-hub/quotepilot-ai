<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — QuotePilot AI</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111e;color:#eaf1ff;font:16px system-ui}.card{width:min(410px,90vw);padding:30px;border:1px solid #31465b;border-radius:18px;background:#112033}h1{margin-top:0}label{display:block;margin:16px 0 5px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;font:inherit}input{background:#091625;color:white;border:1px solid #456079}button{margin-top:16px;border:0;background:#66d9a7;color:#08221a;font-weight:bold;cursor:pointer}.secondary{background:#273d52;color:white}p{color:#b6c7db;font-size:14px}#msg{min-height:35px}</style></head><body><div class="card"><h1>QuotePilot <span style="color:#66d9a7">AI</span></h1><p>Sign in to your business workspace. Verify your email when signing up.</p><div id="social" hidden><button type="button" class="secondary" data-provider="google" hidden>Continue with Google</button><button type="button" class="secondary" data-provider="apple" hidden>Continue with Apple</button></div><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button type="submit" id="signin">Sign in</button></form><button class="secondary" id="signup">Create account</button><button class="secondary" id="reset">Send email to reset password</button><p id="msg" role="status"></p><p><a href="/" style="color:#66d9a7">Return to website</a></p></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const msg=document.getElementById('msg'), email=document.getElementById('email'), password=document.getElementById('password');
let config;try{const r=await fetch('/api/auth-config');config=await r.json()}catch{}
if(!config?.url||!config?.anonKey){msg.textContent='Accounts are not configured yet. The site owner must connect Supabase.';document.querySelectorAll('button').forEach(b=>b.disabled=true)}
else{
 const sb=createClient(config.url,config.anonKey);
 async function enableSocialSignIn() {
   try {
     const response = await fetch(new URL('/auth/v1/settings', config.url), {headers: {apikey: config.anonKey}});
     if (!response.ok) return;
     const {external} = await response.json();
     for (const button of document.querySelectorAll('[data-provider]')) {
       const provider = button.dataset.provider;
       if (external?.[provider] !== true) continue;
       button.onclick = async () => {
         button.disabled = true;
         try {
           const {error} = await sb.auth.signInWithOAuth({provider, options: {redirectTo: location.origin + '/login.html'}});
           if (error) throw error;
         } catch {
           msg.textContent = 'Could not start sign-in. Try again or use your email.';
           button.disabled = false;
         }
       };
       button.hidden = false;
       document.getElementById('social').hidden = false;
     }
   } catch { /* Email sign-in stays available when provider settings cannot load. */ }
 }
 enableSocialSignIn();
 const {data:{session}}=await sb.auth.getSession();if(session)location.replace('/workspace.html');
 document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?.message||'Signed in';if(!error)location.replace('/workspace.html')};
 document.getElementById('signup').onclick=async()=>{msg.textContent='Creating account…';const {error}=await sb.auth.signUp({email:email.value,password:password.value,options:{emailRedirectTo:location.origin+'/login.html'}});msg.textContent=error?.message||'Check your email to confirm your account.'};
 document.getElementById('reset').onclick=async()=>{if(!email.value){msg.textContent='Enter your email first.';return}const {error}=await sb.auth.resetPasswordForEmail(email.value,{redirectTo:location.origin+'/login.html'});msg.textContent=error?.message||'If an account exists, a reset email will arrive. Follow the link to continue.'};
 const {data:{subscription}}=sb.auth.onAuthStateChange(async(event)=>{if(event==='PASSWORD_RECOVERY'){const newPass=prompt('Enter a new password (at least 8 characters)');if(newPass&&newPass.length>=8){const {error}=await sb.auth.updateUser({password:newPass});msg.textContent=error?.message||'Password updated. You can sign in now.'}}});window.addEventListener('pagehide',()=>subscription.unsubscribe());
}
</script></body></html>
